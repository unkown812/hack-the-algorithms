name: Release

# Builds and validates the extension for a published GitHub release. Manual
# dispatch allows validating the pipeline without publishing to the Marketplace.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run unit tests
        run: npm run test

      - name: Package VSIX
        run: npx vsce package --no-dependencies -o dist/daa-learning-companion-validation.vsix

  publish:
    needs: validate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: marketplace

    steps:
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --no-dependencies --no-update-rc
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
